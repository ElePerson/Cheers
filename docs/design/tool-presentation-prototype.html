<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cheers · Git tool presentation</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#09090b; color:#e4e4e7 }
    * { box-sizing:border-box }
    body { margin:0; min-width:320px; min-height:100vh; background:#09090b }
    button { color:inherit; font:inherit; cursor:pointer }
    main { min-height:100vh; display:grid; place-items:center; padding:48px 24px }
    .prototype { width:min(920px,100%) }
    .context { margin:0 0 22px 48px; color:#a1a1aa; font-size:14px }
    .context strong { color:#fafafa }
    .context small { margin-left:8px; color:#52525b }
    .context p { margin:5px 0 0 }
    .activity { width:100%; min-height:48px; display:grid; grid-template-columns:24px auto 1fr auto 18px; align-items:center; gap:14px; padding:0; border:0; background:transparent; text-align:left }
    .activity svg { width:18px; color:#71717a }
    .title { color:#f4f4f5; font-size:15px; font-weight:600 }
    .summary { color:#71717a; font-size:14px }
    .done { display:flex; align-items:center; gap:6px; color:#4ade80; font-size:13px }
    .done svg { width:15px }
    .details { margin:14px 0 0 38px; padding:22px 10px 12px; border-radius:8px; background:rgba(24,24,27,.32) }
    .intro { display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px 24px; padding:0 12px 10px }
    .mono,.path,code { font-family:"SFMono-Regular",Consolas,monospace }
    .branch { color:#a1a1aa; font-size:14px }
    .counts { color:#71717a; font-size:13px }
    .files { margin-top:12px }
    .file { width:100%; min-height:52px; display:grid; grid-template-columns:28px minmax(0,1fr) auto; align-items:center; gap:10px; padding:7px 12px; border:0; border-radius:6px; background:transparent; text-align:left }
    .file:hover,.file[aria-pressed="true"] { background:rgba(39,39,42,.55) }
    .state { color:#d4d4d8; font-family:"SFMono-Regular",Consolas,monospace; font-size:13px }
    .state.added,.plus { color:#4ade80 }
    .minus { color:#f87171 }
    .path { min-width:0; overflow:hidden; color:#d4d4d8; font-size:13px; text-overflow:ellipsis; white-space:nowrap }
    .delta { display:flex; gap:8px; font-family:"SFMono-Regular",Consolas,monospace; font-size:12px }
    .actions { display:flex; gap:28px; padding:18px 12px 4px }
    .actions button { min-height:40px; display:flex; align-items:center; gap:9px; padding:0; border:0; background:transparent; color:#a1a1aa; font-size:13px }
    .actions button:hover { color:#e4e4e7 }
    .actions svg { width:15px }
    .panel { margin:14px 12px 4px; padding:16px; border-radius:7px; background:rgba(9,9,11,.72) }
    .panel-head { display:flex; justify-content:space-between; gap:20px; margin-bottom:14px }
    pre { margin:0; overflow:auto; font-size:12px; line-height:1.65 }
    pre span { display:block; white-space:pre; color:#a1a1aa }
    pre .add { color:#86efac } pre .delete { color:#fca5a5 }
    .command { display:flex; flex-direction:column; gap:7px }
    .command small { color:#52525b }
    [hidden] { display:none!important }
    @media(max-width:640px) {
      main { display:block; padding:30px 18px }
      .context { margin-left:0 }
      .activity { grid-template-columns:22px auto 1fr auto 16px; gap:9px }
      .summary { overflow:hidden; font-size:12px; text-overflow:ellipsis; white-space:nowrap }
      .done span { display:none }
      .details { margin-left:0; padding:20px 4px 10px }
      .intro { display:block; padding-inline:10px }
      .counts { display:block; margin-top:10px }
      .file { min-height:58px; grid-template-columns:24px minmax(0,1fr); padding-inline:10px }
      .file .path { overflow:visible; line-height:1.5; white-space:normal; overflow-wrap:anywhere }
      .file .delta { display:none }
      .actions { flex-direction:column; gap:2px; padding-inline:10px }
      .actions button { width:100%; min-height:48px }
      .panel { margin-inline:10px }
    }
  </style>
</head>
<body>
<main>
  <section class="prototype" aria-label="Interactive Git tool renderer">
    <div class="context"><strong>CheersBot</strong><small>just now</small><p>Updated the Git tool presentation.</p></div>
    <button class="activity" id="activity" aria-expanded="true">
      <i data-lucide="git-branch"></i><span class="title">Git status</span><span class="summary">4 files changed</span>
      <span class="done"><i data-lucide="check"></i><span>Done</span></span><i data-lucide="chevron-down" id="activity-chevron"></i>
    </button>
    <div class="details" id="details">
      <div class="intro"><span class="branch mono">feature/tool-presentation</span><span class="counts">2 staged · 1 unstaged · 1 untracked</span></div>
      <div class="files" id="files"></div>
      <div class="actions">
        <button id="diff-toggle" aria-expanded="false"><i data-lucide="file-diff"></i><span>View diff</span><i data-lucide="chevron-right"></i></button>
        <button id="command-toggle" aria-expanded="false"><i data-lucide="square-terminal"></i><span>Show command</span><i data-lucide="chevron-right"></i></button>
      </div>
      <section class="panel" id="diff-panel" hidden><div class="panel-head"><span class="path" id="diff-path"></span><span class="delta" id="diff-delta"></span></div><pre id="diff"></pre></section>
      <section class="panel command" id="command-panel" hidden><code>git status --short --branch</code><small>cwd: /repo/Cheers</small></section>
    </div>
  </section>
</main>
<script>
  const data = [
    {state:"M",path:"server/src/domain/tool_presentation.rs",plus:28,minus:6,lines:[["","84  fn git_status_result(data: &Value) -> Option<Value> {"],["delete","85−     let output = data.get(\"output\")?;"],["add","85+     let output = output_text(data)?;"],["add","86+     let mut staged = 0_u64;"]]},
    {state:"M",path:"frontend/src/features/chat/BotTracePanel.tsx",plus:42,minus:10,lines:[["","118  function GitStatusInspector({ presentation }) {"],["delete","119−   return <DetailValue value={output} />;"],["add","119+   const files = result.files ?? [];"],["add","120+   return <FileList files={files} />;"]]},
    {state:"A",path:"docs/arch/TOOL_PRESENTATION.md",plus:96,minus:0,lines:[["add","1+ # Tool Presentation Contract"],["add","3+ Structured producer data wins."],["add","4+ The Gateway is the compatibility boundary."]]},
    {state:"M",path:"apps/ios/Sources/Views/BotTracePanelView.swift",plus:34,minus:4,lines:[["","286  if let gitStatus = entry.gitStatusResult {"],["add","287+     Section(\"Working tree\") {"],["add","288+         GitFileList(result: gitStatus)"],["","290  }"]]}
  ];
  let selected = 0;
  const files = document.querySelector("#files");
  function renderFiles(){ files.innerHTML=data.map((f,i)=>`<button class="file" aria-pressed="${i===selected}" data-index="${i}"><span class="state ${f.state==='A'?'added':''}">${f.state}</span><span class="path">${f.path}</span><span class="delta"><span class="plus">+${f.plus}</span>${f.minus?`<span class="minus">−${f.minus}</span>`:''}</span></button>`).join(""); files.querySelectorAll("button").forEach(b=>b.onclick=()=>{selected=Number(b.dataset.index);renderFiles();renderDiff()}) }
  function renderDiff(){ const f=data[selected]; document.querySelector("#diff-path").textContent=f.path; document.querySelector("#diff-delta").innerHTML=`<span class="plus">+${f.plus}</span><span class="minus">−${f.minus}</span>`; document.querySelector("#diff").innerHTML=f.lines.map(([kind,line])=>`<span class="${kind}">${line.replaceAll('&','&amp;').replaceAll('<','&lt;')}</span>`).join("") }
  function toggle(buttonId,panelId,openText,closedText){ const button=document.querySelector(buttonId),panel=document.querySelector(panelId); button.onclick=()=>{const open=panel.hidden;panel.hidden=!open;button.ariaExpanded=String(open);button.querySelector("span").textContent=open?openText:closedText} }
  document.querySelector("#activity").onclick=()=>{const details=document.querySelector("#details"),open=details.hidden;details.hidden=!open;document.querySelector("#activity").ariaExpanded=String(open)};
  toggle("#diff-toggle","#diff-panel","Hide diff","View diff"); toggle("#command-toggle","#command-panel","Hide command","Show command"); renderFiles();renderDiff();lucide.createIcons();
</script>
</body>
</html>
